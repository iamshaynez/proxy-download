# 合并 main 即发布(本仓库单分支模型):构建 down 镜像推 ACR 并部署测试机。
# 构建机 hk-build 与部署目标同机;纪律:shell 登录/pull 重试/冒烟轮询。
name: deploy

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 登录 ACR(重试抗瞬断)
        run: |
          for i in 1 2 3 4 5; do
            echo "${{ secrets.ACR_PASSWORD }}" | docker login "${{ secrets.ACR_REGISTRY }}" -u "${{ secrets.ACR_USERNAME }}" --password-stdin && break
            echo "login 失败,第 $i 次重试"; sleep 5
          done

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # 个人版 ACR 不收 buildx attestation(vnd.oci.empty)——hosted runner 新 buildx 必触发,必须关
          provenance: false
          tags: |
            ${{ secrets.ACR_REGISTRY }}/xiaowenz/down:${{ github.sha }}
            ${{ secrets.ACR_REGISTRY }}/xiaowenz/down:main

      - name: SSH 受限部署到测试机(hk-dev)
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOSTKEY: ${{ secrets.DEPLOY_HOSTKEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_HOSTKEY" > ~/.ssh/known_hosts
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o UserKnownHostsFile=~/.ssh/known_hosts -o StrictHostKeyChecking=yes deploy@207.57.130.82
